name: The report looks wrong
description: A status, size or forecast doesn't match what you see.
labels: ["report"]
body:
  - type: input
    id: version
    attributes:
      label: diskvet and ClickHouse versions
      description: The second line of the report.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the report says, and what you expected
      description: For disk numbers, add the output of `df -h` for the ClickHouse data disk.
    validations:
      required: true
