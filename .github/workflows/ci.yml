name: ci

on:
  push:
  pull_request:
  # Every Monday: "latest" moves on, and a new ClickHouse release may rename a
  # system table column that checks.sql reads.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  offline:
    # No server: SQL safety, payload privacy, report rendering from fixtures,
    # under dash and under busybox ash + busybox awk.
    runs-on: ubuntu-latest
    outputs:
      kubernetes: ${{ steps.changes.outputs.kubernetes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does this change need the kubernetes job?
        # On main and on the weekly run always; otherwise when a file that
        # tests/k8s.sh runs or reads changed: diskvet.sh, checks.sql, README.md
        # (the Role of Permissions), tests/k8s*, tests/seed.sql, the payload
        # checker and its key list, two fixtures, or this workflow.
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=false
          from=""
          case $EVENT in
            schedule|workflow_dispatch) run=true ;;
            push) if [ "$REF" = refs/heads/main ]; then run=true; else from=$BEFORE; fi ;;
            pull_request) from=$BASE ;;
          esac
          if [ "$run" = false ]; then
            # a new branch or an unknown base: every file counts as changed
            if [ -n "$from" ] && git cat-file -e "$from^{commit}" 2>/dev/null; then
              files=$(git diff --name-only "$from" HEAD)
            else
              files=$(git ls-files)
            fi
            if printf '%s\n' "$files" | grep -Eq '^(diskvet\.sh|checks\.sql|README\.md|tests/k8s.*|tests/seed\.sql|tests/check_payload\.sh|tests/payload_keys\.txt|tests/fixtures/(test\.env|ch-test\.xml)|\.github/workflows/ci\.yml)$'; then run=true; fi
          fi
          echo "kubernetes=$run" >>"$GITHUB_OUTPUT"
          echo "kubernetes job: $run"
      - name: checks.sql is SELECT from system.* only
        run: sh tests/check_sql.sh
      - name: shellcheck (POSIX sh)
        # preinstalled on ubuntu-latest
        run: shellcheck -s sh diskvet.sh tests/*.sh tests/fixtures/fake-kubectl/*
      - name: Offline tests with dash and mawk
        run: dash tests/replay.sh
      - name: Offline tests with busybox ash and busybox awk
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq busybox
          mkdir -p /tmp/bb
          busybox --install -s /tmp/bb
          PATH=/tmp/bb:$PATH busybox sh tests/replay.sh

  clickhouse:
    # Real servers in Docker: seed problems, run the script from the host and
    # inside the container, with --k8s through the fake kubectl (tests/k8s_shim.sh),
    # as the Variant B user, then run the fix commands.
    runs-on: ubuntu-latest
    needs: offline
    strategy:
      fail-fast: false
      matrix:
        clickhouse: ["24.8", "25.12", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull clickhouse/clickhouse-server:${{ matrix.clickhouse }}
        run: docker pull -q clickhouse/clickhouse-server:${{ matrix.clickhouse }}
      - name: Integration test
        run: sh tests/run.sh "${{ matrix.clickhouse }}"
      - name: --docker auto with docker compose
        run: CH_VERSION="${{ matrix.clickhouse }}" sh tests/auto.sh
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-clickhouse-${{ matrix.clickhouse }}
          path: tests/out/
          retention-days: 14

  kubernetes:
    # A real cluster: kind, with the API server's audit log on. tests/k8s.sh
    # installs ClickHouse five ways (a plain StatefulSet, the ClickHouse
    # operator with the Langfuse chart's resources, the Bitnami charts 8.x and
    # 9.x, the Altinity operator with a ClickHouseInstallation), runs
    # --k8s against each, runs the fixes the reports print, and reads the
    # audit log. On main, weekly, and when a file it runs or reads changes
    # (the list is in the offline job's "changes" step).
    runs-on: ubuntu-latest
    needs: offline
    if: needs.offline.outputs.kubernetes == 'true'
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: kind cluster with the audit log on
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: diskvet
          config: tests/k8s/kind.yaml
          wait: 180s
      - name: Kubernetes test
        env:
          DISKVET_KIND: "1"
        run: sh tests/k8s.sh
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-kubernetes
          path: tests/out/
          retention-days: 14
