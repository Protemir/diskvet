# Audit policy of the kind cluster (tests/k8s/kind.yaml). Metadata level: who
# did what, and the request URL, where kubectl puts the command line of an
# exec; never request or response bodies. tests/k8s.sh reads the log to show
# that the command lines of diskvet hold no password and no salt, and what the
# test ServiceAccounts did.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  # every exec, attach and port-forward into a pod, by anyone
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/ephemeralcontainers"]
  # every request of the test ServiceAccounts (tests/k8s/rbac.yaml)
  - level: Metadata
    userGroups: ["system:serviceaccounts:dv-plain"]
  # every change to a pod
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods"]
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
  - level: None
